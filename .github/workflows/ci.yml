name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Catches the mistakes only a consumer would otherwise find: an exports
      # map that points at a file the build does not emit, or CJS types handed
      # to an ESM importer.
      - run: pnpm run check:publish

  # The SDK compiles nothing in, so the only way it can rot is if the shapes it
  # reads change. This reads the live catalogue and status and fails when a
  # field it depends on is gone.
  contract:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:contract
        continue-on-error: true
